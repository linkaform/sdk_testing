# Archivo de configuracion pytest para Location (Ubicaciones)
[pytest]
log_cli = true
log_cli_level = INFO
pythonpath = 
    .
    ..
    /usr/local/lib/python3.12/site-packages/lkf_modules/location/items/scripts/Locations
filterwarnings =
    ignore:Unverified HTTPS request
markers =
    unit: Pruebas unitarias (sin red, sin BD, todo mockeado)
    bug(folio): Test ligado a un ticket de bug (AAMM-<folio>), abierto o corregido; se queda para regresión. Correr con --bug <folio>
